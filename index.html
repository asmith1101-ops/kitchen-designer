<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Kitchen Designer — Shared</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f1ea; --surface:#fffdf7; --surface-alt:#ece7da; --text:#1e2a36; --dim:#68778a; --border:#ddd3bf;
  --accent:#16324f; --accent-text:#fff; --oak:#b97c2e; --rust:#c0452f; --good:#2e7d4f;
  --bp-bg:#14304d; --bp-bg-edge:#0f2740; --bp-grid-minor:rgba(190,216,240,.10); --bp-grid-major:rgba(190,216,240,.22); --bp-line:#dcebf7; --bp-dim:#9fc0da; --bp-item-edge:#16324f;
  --font-display:"Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0d141c; --surface:#16202b; --surface-alt:#1d2a38; --text:#ece7db; --dim:#93a1b1; --border:#2a3947; --accent:#8fc1e9; --accent-text:#0d1b29; --oak:#d29a4a; --rust:#e0705c; --good:#5cb887; }
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
.font-display{font-family:var(--font-display)}
.mono{font-family:ui-monospace,SF Mono,Menlo,monospace;font-variant-numeric:tabular-nums}
button{cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--oak)}
/* layout */
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
header .logo{font-size:20px;color:var(--oak)}
#designName{font-family:var(--font-display);font-weight:800;font-size:18px;background:transparent;border:none;outline:none;flex:1;min-width:0}
#designName:focus{border-bottom:2px solid var(--oak)}
.pill{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;background:var(--surface-alt);padding:6px 10px;border-radius:999px;white-space:nowrap}
.share-strip{display:flex;align-items:center;gap:10px;padding:7px 16px;background:#16324f;color:#dcebf7;font-size:13px;flex-shrink:0}
.share-strip b{color:#fff}
.share-strip button{margin-left:auto;background:#fff;color:#16324f;border:none;padding:6px 12px;border-radius:6px;font-weight:700;font-size:13px;white-space:nowrap}
#main{display:flex;flex:1;min-height:0;flex-direction:column}
@media(min-width:768px){#main{flex-direction:row}}
#canvasSection{position:relative;height:44dvh;flex-shrink:0;background:var(--bp-bg-edge);overflow:hidden}
@media(min-width:768px){#canvasSection{order:2;flex:1;height:auto}}
aside{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--surface);border-top:1px solid var(--border)}
@media(min-width:768px){aside{order:1;width:400px;flex:none;border-top:none;border-right:1px solid var(--border)}}
nav.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
nav.tabs button{position:relative;font-family:var(--font-display);font-weight:700;font-size:14px;padding:8px 14px;border-radius:7px;border:none;background:transparent;color:var(--dim);white-space:nowrap}
nav.tabs button.active{background:var(--accent);color:var(--accent-text)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--rust);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#panel{flex:1;overflow-y:auto;padding:16px;padding-bottom:32px}
label.field{display:flex;flex-direction:column;gap:4px}
label.field span, .label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.field input,.field select,.field textarea,.search-input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:9px 10px;font-size:16px}
.btn{font-family:var(--font-display);font-weight:700;border-radius:7px;padding:9px 14px;border:1px solid var(--border);background:var(--bg)}
.btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn-oak{background:var(--oak);color:#fff;border-color:var(--oak)}
.btn-rust{background:var(--rust);color:#fff;border-color:var(--rust)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cat-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.swatch{width:36px;height:36px;border-radius:6px;border:1px solid rgba(0,0,0,.25);flex-shrink:0}
.finish-dot{width:32px;height:32px;border-radius:999px;border:1px solid rgba(0,0,0,.25);padding:0}
.finish-dot.sel{outline:2px solid var(--oak);outline-offset:2px}
#svgWrap{position:absolute;inset:0}
#planSvg{width:100%;height:100%;display:block;touch-action:none}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;align-items:center}
.zoomctl button{height:40px;min-width:40px;border-radius:7px;border:none;background:rgba(0,0,0,.38);color:#dcebf7;font-size:16px;font-weight:700;backdrop-filter:blur(4px);padding:0 10px}
.hint{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.32);color:#b8d2e8;font-size:12px;padding:6px 10px;border-radius:6px;pointer-events:none;max-width:70%}
.check-card{border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;text-align:left;width:100%;background:var(--surface)}
#saveStatus{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;background:var(--surface-alt);padding:6px 10px;border-radius:999px;white-space:nowrap;color:var(--dim)}
@media(max-width:640px){ .pill{display:none} .share-strip{font-size:12px} #designName{font-size:15px} header{padding:8px 10px;gap:8px} nav.tabs button{padding:7px 9px;font-size:13px} .hint{display:none} }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo font-display" aria-hidden="true">⌂</span>
    <input id="designName" value="Our kitchen — sketch" aria-label="Design name">
    <span id="budgetPill" class="pill">$0 · 0 pcs</span>
    <span id="saveStatus">Sign in to save</span>
    <button id="topDownload" class="btn btn-primary" style="padding:7px 12px;font-size:13px">Download copy</button>
  </header>
  <div class="share-strip">
    <span>👋 <b>Hi Christine!</b> Sketch freely — sign in under the <b>Account</b> tab and your designs save to the library you and Smitty share.</span>
    <button id="stripShareBtn">How to keep it ↓</button>
  </div>

  <div id="main">
    <section id="canvasSection" aria-label="Floor plan">
      <div id="svgWrap">
        <svg id="planSvg" role="application" aria-label="Kitchen floor plan editor"></svg>
        <div class="hint">Drag pieces to move · pinch or scroll to zoom · drag right / bottom wall to resize room</div>
        <div class="zoomctl">
          <span id="scaleLabel" class="mono" style="background:rgba(0,0,0,.35);color:#dcebf7;font-size:12px;padding:8px;border-radius:6px">2.0 px/in</span>
          <button id="zoomOut" aria-label="Zoom out">−</button>
          <button id="zoomIn" aria-label="Zoom in">+</button>
          <button id="zoomFit">Fit</button>
        </div>
      </div>
    </section>

    <aside>
      <nav class="tabs" aria-label="Designer panels" id="tabsNav"></nav>
      <div id="panel"></div>
    </aside>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

{id:"island-60",name:"Island 60×36",category:"Islands & seating",layer:"floor",role:null,wIn:60,dIn:36,hIn:36,color:"#4a6076",blurb:"Freestanding island — keep 42″ clear"},
{id:"peninsula-48",name:"Peninsula 48×24",category:"Islands & seating",layer:"floor",role:null,wIn:48,dIn:24,hIn:34.5,color:"#4a6076",blurb:"Counter run attached to wall"},
{id:"table-72",name:"Table 72×36",category:"Islands & seating",layer:"floor",role:null,wIn:72,dIn:36,hIn:30,color:"#7a5230",blurb:"Eat-in kitchen table"},

{id:"cart-30",name:"Rolling cart 30×18",category:"Islands & seating",layer:"floor",role:null,wIn:30,dIn:18,hIn:34,color:"#8a9a7b",blurb:"Mobile prep cart"},
];
const CATEGORIES=["Cabinets","Appliances","Islands & seating"];
const FINISHES=[{name:"Natural oak",hex:"#c99a5b"},{name:"Walnut",hex:"#7a5230"},{name:"Butcher block",hex:"#d9b380"},{name:"Painted white",hex:"#e8e4da"},{name:"Slate blue",hex:"#4a6076"},{name:"Sage",hex:"#8a9a7b"},{name:"Charcoal",hex:"#3a3f45"},{name:"Stainless",hex:"#b9c0c7"},{name:"Matte black",hex:"#26262a"},{name:"Marble",hex:"#dfe3e6"}];
const ROOM_PRESETS=[{label:"10 × 12",w:120,d:144},{label:"12 × 12",w:144,d:144},{label:"12 × 14",w:144,d:168},{label:"14 × 16",w:168,d:192},{label:"16 × 20",w:192,d:240},{label:"Galley 8 × 16",w:96,d:192}];

let uidC=0; function uid(){uidC++;return 'id-'+Date.now().toString(36)+'-'+uidC+'-'+Math.floor(Math.random()*1e6).toString(36)}
function clamp(v,lo,hi){return Math.min(hi,Math.max(lo,v))}
function snap(v){return Math.round(v)}
function effSize(it){return it.rotation%180===0?{w:it.wIn,d:it.dIn}:{w:it.dIn,d:it.wIn}}
function itemRect(it){const s=effSize(it);return{x:it.xIn,y:it.yIn,w:s.w,d:s.d}}
function rectsOverlap(a,b,shrink){shrink=shrink==null?0.06:shrink;return a.x+shrink<b.x+b.w-shrink&&b.x+shrink<a.x+a.w-shrink&&a.y+shrink<b.y+b.d-shrink&&b.y+shrink<a.y+a.d-shrink}
function centerOf(r){return{x:r.x+r.w/2,y:r.y+r.d/2}}
function fmtIn(ins){const r=Math.round(ins*10)/10;const ft=Math.floor(r/12);const rem=Math.round((r-ft*12)*10)/10;if(ft===0)return rem+'″';if(rem===0)return ft+'′';return ft+'′ '+rem+'″'}
function fmtMoney(c){return (c/100).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:c%100===0?0:2})}
function openingPoint(op,room){const mid=op.offsetIn+op.widthIn/2;switch(op.wall){case'north':return{x:mid,y:0,nx:0,ny:-1,horizontal:true};case'south':return{x:mid,y:room.depthIn,nx:0,ny:1,horizontal:true};case'west':return{x:0,y:mid,nx:-1,ny:0,horizontal:false};case'east':return{x:room.widthIn,y:mid,nx:1,ny:0,horizontal:false}}}
function distFt(a,b){return Math.hypot(a.x-b.x,a.y-b.y)/12}
function analyze(data){
  const room=data.room, items=data.items; const overlaps=[],outOfBounds=[],walkways=[];
  for(const it of items){const r=itemRect(it); if(r.x<-0.05||r.y<-0.05||r.x+r.w>room.widthIn+0.05||r.y+r.d>room.depthIn+0.05) outOfBounds.push(it)}
  for(let i=0;i<items.length;i++){const a=items[i],ra=itemRect(a); for(let j=i+1;j<items.length;j++){const b=items[j],rb=itemRect(b);
    // Upper pieces (wall cabinets, cooktops, hoods) are meant to sit over floor pieces in plan view — never a collision.
    if(a.layer!==b.layer) continue;
    if(rectsOverlap(ra,rb)){overlaps.push({aId:a.id,bId:b.id,aName:a.name,bName:b.name}); continue}
    if(a.layer==='floor'&&b.layer==='floor'){const ox=Math.min(ra.x+ra.w,rb.x+rb.w)-Math.max(ra.x,rb.x); const oy=Math.min(ra.y+ra.d,rb.y+rb.d)-Math.max(ra.y,rb.y);
      // Skip the pair if another floor piece sits between them — that's a run of cabinets, not a walkway.
      const blocked=(gr)=>items.some((k,ki)=>ki!==i&&ki!==j&&k.layer==='floor'&&rectsOverlap(gr,itemRect(k),-0.5));
      if(ox>=12){const gapY=rb.y>=ra.y+ra.d?rb.y-(ra.y+ra.d):ra.y-(rb.y+rb.d); if(gapY>=8&&gapY<60){const top=rb.y>=ra.y+ra.d?ra:rb; const gr={x:Math.max(ra.x,rb.x),y:top.y+top.d,w:ox,d:gapY}; if(!blocked(gr)){const midX=Math.max(ra.x,rb.x)+ox/2; walkways.push({aId:a.id,bId:b.id,gapIn:gapY,severity:gapY<36?'narrow':gapY<42?'tight':'ok',x1:midX,y1:top.y+top.d,x2:midX,y2:top.y+top.d+gapY})}}}
      else if(oy>=12){const gapX=rb.x>=ra.x+ra.w?rb.x-(ra.x+ra.w):ra.x-(rb.x+rb.w); if(gapX>=8&&gapX<60){const left=rb.x>=ra.x+ra.w?ra:rb; const gr={x:left.x+left.w,y:Math.max(ra.y,rb.y),w:gapX,d:oy}; if(!blocked(gr)){const midY=Math.max(ra.y,rb.y)+oy/2; walkways.push({aId:a.id,bId:b.id,gapIn:gapX,severity:gapX<36?'narrow':gapX<42?'tight':'ok',x1:left.x+left.w,y1:midY,x2:left.x+left.w+gapX,y2:midY})}}}
    }}}
  walkways.sort((p,q)=>p.gapIn-q.gapIn);
  const sink=items.find(i=>i.role==='sink'), cook=items.find(i=>i.role==='cooking'), fridge=items.find(i=>i.role==='fridge'); let triangle=null;
  if(sink&&cook&&fridge){const cs=centerOf(itemRect(sink)),cc=centerOf(itemRect(cook)),cf=centerOf(itemRect(fridge)); const sc=distFt(cs,cc),cf2=distFt(cc,cf),fs=distFt(cf,cs); const total=sc+cf2+fs; const legs=[sc,cf2,fs]; const ok=total>=13&&total<=26&&legs.every(l=>l>=4&&l<=9); triangle={legsFt:{sinkCook:sc,cookFridge:cf2,fridgeSink:fs},totalFt:total,ok,verdict: ok?"Inside the classic 13–26 ft work-triangle range, every leg 4–9 ft.": total<13?"Tighter than the classic 13 ft minimum — workable, but expect crowding with two cooks.": total>26?"Over the classic 26 ft maximum — lots of steps between sink, stove, and fridge.":"Total is in range, but one leg falls outside 4–9 ft."}}
  let budget=0,priced=0; for(const it of items) if(it.priceCents!=null){budget+=it.priceCents;priced++}
  return{overlaps,outOfBounds,walkways,triangle,budgetCents:budget,pricedCount:priced,unpricedCount:items.length-priced,areaSqFt:(room.widthIn*room.depthIn)/144}
}
function itemFromCatalog(e,x,y){return{id:uid(),catalogId:e.id,name:e.name,category:e.category,layer:e.layer,role:e.role,xIn:x,yIn:y,wIn:e.wIn,dIn:e.dIn,hIn:e.hIn,rotation:0,color:e.color,priceCents:null,productUrl:null,notes:null}}
function emptyDesign(){return{room:{widthIn:168,depthIn:144,wallHeightIn:96},openings:[{id:uid(),wall:"north",offsetIn:54,widthIn:60,kind:"window"},{id:uid(),wall:"south",offsetIn:120,widthIn:36,kind:"door"}],items:[]}}
function findSpot(data,w,d,layer){const W=data.room.widthIn,D=data.room.depthIn,others=data.items.filter(i=>i.layer===layer); for(let y=0;y+d<=D;y+=6) for(let x=0;x+w<=W;x+=6){const r={x,y,w,d}; if(!others.some(o=>rectsOverlap(r,itemRect(o),0))) return{x,y}} return{x:Math.max(0,Math.round((W-w)/2)),y:Math.max(0,Math.round((D-d)/2))}}
function runTemplate(items,data,entryId,x,y,rot){rot=rot||0; const e=CATALOG.find(c=>c.id===entryId); if(!e)return; const it=itemFromCatalog(e,x,y); it.rotation=rot; items.push(it)}
function layoutTemplate(kind,data){const W=data.room.widthIn,D=data.room.depthIn,items=[]; runTemplate(items,data,"fridge-36",0,0); runTemplate(items,data,"base-24",36,0); runTemplate(items,data,"sink-33",60,0); runTemplate(items,data,"dishwasher-24",93,0); runTemplate(items,data,"base-24",117,0); runTemplate(items,data,"wall-30",60,0); runTemplate(items,data,"wall-30",117,0);
 if(kind==="l-shape"||kind==="u-shape"||kind==="island"){runTemplate(items,data,"range-30",3,36,90); runTemplate(items,data,"base-24",0,66,90); runTemplate(items,data,"trash-18",3,90,90); runTemplate(items,data,"hood-30",3,36,90)}
 if(kind==="u-shape"){runTemplate(items,data,"base-36",24,D-24); runTemplate(items,data,"base-36",60,D-24); runTemplate(items,data,"pantry-24",W-24,D-24)}
 if(kind==="galley"){runTemplate(items,data,"range-30",36,D-27); runTemplate(items,data,"base-36",66,D-24); runTemplate(items,data,"base-24",102,D-24)}
 if(kind==="island"){runTemplate(items,data,"island-60",Math.max(48,W/2-30),Math.max(66,D/2-18)); runTemplate(items,data,"stool-16",Math.max(48,W/2-24),Math.max(66,D/2-18)+40); runTemplate(items,data,"stool-16",Math.max(48,W/2-4),Math.max(66,D/2-18)+40); runTemplate(items,data,"stool-16",Math.max(48,W/2+16),Math.max(66,D/2-18)+40)}
 return items.filter(it=>{const r=itemRect(it); return r.x>=0&&r.y>=0&&r.x+r.w<=W&&r.y+r.d<=D})}
function shortName(n){return n.replace(/\s+\d+(″|×\d+.*)$/,"").trim()||n}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// ---------- Design serializer (single source of truth: download + cloud save) ----------
function serializeDesign(){const name=(document.getElementById('designName').value||'kitchen-design').trim(); return {app:'kitchen-designer',version:1,name,exportedAt:new Date().toISOString(),data:design};}

// ---------- State ----------
let design = emptyDesign();
design.items = layoutTemplate("l-shape", design);
let selectedItemId=null, selectedOpeningId=null, currentTab="add", searchQuery="", customOpen=false, confirmTemplate=null, confirmClear=false;
let view={scale:2,tx:40,ty:40}; let containerSize={w:600,h:400}; let userMoved=false; let fitted=false;

// ---------- DOM refs ----------
const svg=document.getElementById('planSvg'), panel=document.getElementById('panel'), tabsNav=document.getElementById('tabsNav'), budgetPill=document.getElementById('budgetPill'), scaleLabel=document.getElementById('scaleLabel'), wrap=document.getElementById('svgWrap');

function getAnalysis(){return analyze(design)}
function issueCount(){const a=getAnalysis(); return a.overlaps.length+a.outOfBounds.length+a.walkways.filter(w=>w.severity!=="ok").length}

// ---------- Tabs ----------
const TABS=[{id:"add",label:"Add"},{id:"edit",label:"Edit"},{id:"room",label:"Room"},{id:"checks",label:"Checks"},{id:"share",label:"Keep & Share"},{id:"account",label:"Account"}];
function renderTabs(){
  const ic=issueCount();
  tabsNav.innerHTML=TABS.map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${t.label}${t.id==='checks'&&ic?`<span class="badge">${ic}</span>`:''}</button>`).join('');
  tabsNav.querySelectorAll('button').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab; renderTabs(); renderPanel();});
}
function updateHeader(){const a=getAnalysis(); budgetPill.textContent=fmtMoney(a.budgetCents)+' · '+design.items.length+' pcs'; scaleLabel.textContent=view.scale.toFixed(1)+' px/in'; renderTabs();}

// ---------- Canvas rendering ----------
function renderCanvas(){
  const W=design.room.widthIn, D=design.room.depthIn, a=getAnalysis();
  const visX=-view.tx/view.scale, visY=-view.ty/view.scale, visW=containerSize.w/view.scale, visH=containerSize.h/view.scale;
  const overlapIds=new Set(); a.overlaps.forEach(o=>{overlapIds.add(o.aId); overlapIds.add(o.bId)}); const oobIds=new Set(a.outOfBounds.map(i=>i.id));
  let s='';
  s+=`<defs><pattern id="grid-minor" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M 6 0 H 0 V 6" fill="none" stroke="var(--bp-grid-minor)" stroke-width="0.3"/></pattern><pattern id="grid-major" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M 12 0 H 0 V 12" fill="none" stroke="var(--bp-grid-major)" stroke-width="0.35"/></pattern><radialGradient id="bp-vignette" cx="50%" cy="42%" r="80%"><stop offset="0%" stop-color="#1a3a5c"/><stop offset="100%" stop-color="#0f2740"/></radialGradient></defs>`;
  s+=`<rect x="${visX}" y="${visY}" width="${visW}" height="${visH}" fill="url(#bp-vignette)" data-bg="1"/>`;
  s+=`<g transform="translate(${view.tx} ${view.ty}) scale(${view.scale})">`;
  s+=`<rect x="${visX}" y="${visY}" width="${visW}" height="${visH}" fill="url(#grid-minor)"/><rect x="${visX}" y="${visY}" width="${visW}" height="${visH}" fill="url(#grid-major)"/>`;
  // dimensions
  s+=`<g stroke="var(--bp-dim)" stroke-width="0.4"><line x1="0" y1="-7" x2="${W}" y2="-7"/><line x1="0" y1="-9" x2="0" y2="-5"/><line x1="${W}" y1="-9" x2="${W}" y2="-5"/><line x1="-7" y1="0" x2="-7" y2="${D}"/><line x1="-9" y1="0" x2="-5" y2="0"/><line x1="-9" y1="${D}" x2="-5" y2="${D}"/></g>`;
  s+=`<text x="${W/2}" y="-9.5" text-anchor="middle" font-size="4.4" fill="var(--bp-dim)" class="mono">${fmtIn(W)}</text>`;
  s+=`<text x="-10" y="${D/2}" text-anchor="middle" font-size="4.4" fill="var(--bp-dim)" transform="rotate(-90 -10 ${D/2})">${fmtIn(D)}</text>`;
  s+=`<rect x="0" y="0" width="${W}" height="${D}" fill="rgba(220,235,247,0.045)" stroke="var(--bp-line)" stroke-width="1.5"/>`;
  s+=`<rect x="${W-1.6}" y="0" width="3.2" height="${D}" fill="transparent" data-type="wall" data-wall="east" style="cursor:ew-resize"/><rect x="0" y="${D-1.6}" width="${W}" height="3.2" fill="transparent" data-type="wall" data-wall="south" style="cursor:ns-resize"/>`;
  // items
  const ordered=[...design.items.filter(i=>i.layer==='floor'),...design.items.filter(i=>i.layer==='upper')];
  for(const item of ordered){
    const r=itemRect(item), selected=selectedItemId===item.id, bad=overlapIds.has(item.id)||oobIds.has(item.id);
    let glyph='';
    if(item.role==='sink') glyph=`<g stroke="var(--bp-item-edge)" fill="none" stroke-width="0.5" opacity="0.75"><rect x="${r.w*0.14}" y="${r.d*0.16}" width="${r.w*0.72}" height="${r.d*0.62}" rx="1.5"/><circle cx="${r.w/2}" cy="${r.d/2}" r="${Math.min(r.w,r.d)*0.09}"/></g>`;
    else if(item.role==='cooking'&&item.catalogId!=='oven-30'){const rr=Math.min(r.w,r.d)*0.16; glyph=`<g stroke="var(--bp-item-edge)" fill="none" stroke-width="0.5" opacity="0.75"><circle cx="${r.w*0.28}" cy="${r.d*0.3}" r="${rr}"/><circle cx="${r.w*0.72}" cy="${r.d*0.3}" r="${rr*0.8}"/><circle cx="${r.w*0.28}" cy="${r.d*0.72}" r="${rr*0.8}"/><circle cx="${r.w*0.72}" cy="${r.d*0.72}" r="${rr}"/></g>`}
    else if(item.role==='fridge') glyph=`<g stroke="var(--bp-item-edge)" stroke-width="0.5" opacity="0.7"><line x1="1" y1="1" x2="${r.w-1}" y2="${r.d-1}"/><line x1="${r.w*0.55}" y1="1" x2="${r.w*0.55}" y2="${r.d*0.45}" stroke-width="1"/></g>`;
    s+=`<g><g transform="translate(${r.x} ${r.y})" data-type="item" data-id="${item.id}" style="cursor:grab"><rect x="0" y="0" width="${r.w}" height="${r.d}" fill="${item.color}" fill-opacity="${item.layer==='upper'?0.55:0.92}" stroke="${bad?'#e0705c':selected?'#e8a33d':'var(--bp-item-edge)'}" stroke-width="${selected||bad?1.1:0.6}" ${item.layer==='upper'?'stroke-dasharray="3 2"':''} rx="0.8"/>${glyph}</g>`;
    if(r.w>=20&&r.d>=13) s+=`<g pointer-events="none"><text x="${r.x+r.w/2}" y="${r.y+r.d/2-0.4}" text-anchor="middle" font-size="3.5" font-weight="600" fill="#16324f" opacity="0.88">${esc(shortName(item.name))}</text><text x="${r.x+r.w/2}" y="${r.y+r.d/2+3.8}" text-anchor="middle" font-size="2.9" fill="#16324f" opacity="0.65">${Math.round(r.w)}×${Math.round(r.d)}</text></g>`;
    else if(r.w>=13&&r.d>=10) s+=`<text x="${r.x+r.w/2}" y="${r.y+r.d/2+1.2}" text-anchor="middle" font-size="2.9" fill="#16324f" opacity="0.7" pointer-events="none">${Math.round(r.w)}×${Math.round(r.d)}</text>`;
    if(selected) s+=`<g fill="#e8a33d" stroke="#16324f" stroke-width="0.4"><circle cx="${r.x+r.w}" cy="${r.y+r.d/2}" r="2" data-type="handle" data-id="${item.id}" data-handle="e" style="cursor:ew-resize"/><circle cx="${r.x+r.w/2}" cy="${r.y+r.d}" r="2" data-type="handle" data-id="${item.id}" data-handle="s" style="cursor:ns-resize"/><circle cx="${r.x+r.w}" cy="${r.y+r.d}" r="2.3" data-type="handle" data-id="${item.id}" data-handle="se" style="cursor:nwse-resize"/></g>`;
    s+=`</g>`;
  }
  // openings
  for(const op of design.openings){
    const horiz=op.wall==='north'||op.wall==='south'; const wallY=op.wall==='north'?0:op.wall==='south'?D:null; const wallX=op.wall==='west'?0:op.wall==='east'?W:null; const selected=selectedOpeningId===op.id; const p=openingPoint(op,design.room);
    if(horiz) s+=`<rect x="${op.offsetIn}" y="${wallY-1.6}" width="${op.widthIn}" height="3.2" fill="var(--bp-bg)"/>`; else s+=`<rect x="${wallX-1.6}" y="${op.offsetIn}" width="3.2" height="${op.widthIn}" fill="var(--bp-bg)"/>`;
    if(op.kind==='window'){ if(horiz) s+=`<g stroke="var(--bp-line)" stroke-width="0.5"><line x1="${op.offsetIn}" y1="${wallY-0.8}" x2="${op.offsetIn+op.widthIn}" y2="${wallY-0.8}"/><line x1="${op.offsetIn}" y1="${wallY+0.8}" x2="${op.offsetIn+op.widthIn}" y2="${wallY+0.8}"/></g>`; else s+=`<g stroke="var(--bp-line)" stroke-width="0.5"><line x1="${wallX-0.8}" y1="${op.offsetIn}" x2="${wallX-0.8}" y2="${op.offsetIn+op.widthIn}"/><line x1="${wallX+0.8}" y1="${op.offsetIn}" x2="${wallX+0.8}" y2="${op.offsetIn+op.widthIn}"/></g>`}
    if(op.kind==='cased'){ if(horiz) s+=`<g stroke="var(--bp-line)" stroke-width="0.6"><line x1="${op.offsetIn}" y1="${wallY-1.6}" x2="${op.offsetIn}" y2="${wallY+1.6}"/><line x1="${op.offsetIn+op.widthIn}" y1="${wallY-1.6}" x2="${op.offsetIn+op.widthIn}" y2="${wallY+1.6}"/></g>`; else s+=`<g stroke="var(--bp-line)" stroke-width="0.6"><line x1="${wallX-1.6}" y1="${op.offsetIn}" x2="${wallX+1.6}" y2="${op.offsetIn}"/><line x1="${wallX-1.6}" y1="${op.offsetIn+op.widthIn}" x2="${wallX+1.6}" y2="${op.offsetIn+op.widthIn}"/></g>`}
    if(op.kind==='door'){const inw={x:-p.nx,y:-p.ny}; const hinge=horiz?{x:op.offsetIn,y:wallY}:{x:wallX,y:op.offsetIn}; const leafEnd={x:hinge.x+inw.x*op.widthIn*0.94,y:hinge.y+inw.y*op.widthIn*0.94}; const closed=horiz?{x:hinge.x+op.widthIn,y:hinge.y}:{x:hinge.x,y:hinge.y+op.widthIn}; const sweep=(op.wall==='south'||op.wall==='east')?0:1; s+=`<g stroke="var(--bp-dim)" fill="none" stroke-width="0.45" opacity="0.85"><line x1="${hinge.x}" y1="${hinge.y}" x2="${leafEnd.x}" y2="${leafEnd.y}"/><path d="M ${closed.x} ${closed.y} A ${op.widthIn} ${op.widthIn} 0 0 ${sweep} ${leafEnd.x} ${leafEnd.y}" stroke-dasharray="2.5 2"/></g>`}
    if(selected){ if(horiz) s+=`<rect x="${op.offsetIn-1}" y="${wallY-2.6}" width="${op.widthIn+2}" height="5.2" fill="none" stroke="#e8a33d" stroke-width="0.7" stroke-dasharray="3 2" pointer-events="none"/>`; else s+=`<rect x="${wallX-2.6}" y="${op.offsetIn-1}" width="5.2" height="${op.widthIn+2}" fill="none" stroke="#e8a33d" stroke-width="0.7" stroke-dasharray="3 2" pointer-events="none"/>`}
    if(horiz) s+=`<rect x="${op.offsetIn}" y="${wallY-3.4}" width="${op.widthIn}" height="6.8" fill="transparent" data-type="opening" data-id="${op.id}" style="cursor:ew-resize"/>`; else s+=`<rect x="${wallX-3.4}" y="${op.offsetIn}" width="6.8" height="${op.widthIn}" fill="transparent" data-type="opening" data-id="${op.id}" style="cursor:ns-resize"/>`;
  }
  // walkways
  a.walkways.filter(w=>w.gapIn<48).forEach(wk=>{const color=wk.severity==='narrow'?'#e0705c':wk.severity==='tight'?'#e8a33d':'#7fc98f'; const mx=(wk.x1+wk.x2)/2,my=(wk.y1+wk.y2)/2; s+=`<g pointer-events="none"><line x1="${wk.x1}" y1="${wk.y1}" x2="${wk.x2}" y2="${wk.y2}" stroke="${color}" stroke-width="0.55" stroke-dasharray="2.5 1.8"/><rect x="${mx-5.4}" y="${my-2.6}" width="10.8" height="5.2" rx="1.4" fill="#0f2740" stroke="${color}" stroke-width="0.4"/><text x="${mx}" y="${my+1.5}" text-anchor="middle" font-size="3.4" fill="${color}">${Math.round(wk.gapIn)}″</text></g>`});
  s+=`</g>`;
  svg.innerHTML=s;
  scaleLabel.textContent=view.scale.toFixed(1)+' px/in';
}
function fit(){const w=containerSize.w,h=containerSize.h; if(w<10||h<10)return; const W=design.room.widthIn,D=design.room.depthIn; const scale=Math.min(w/(W+56),h/(D+56)); view={scale,tx:(w-W*scale)/2,ty:(h-D*scale)/2}; renderCanvas(); updateHeader();}
function toInches(cx,cy){const r=svg.getBoundingClientRect(); const px=cx-r.left, py=cy-r.top; return{x:(px-view.tx)/view.scale, y:(py-view.ty)/view.scale, px,py}}
function zoomBy(f){userMoved=true; const cx=containerSize.w/2, cy=containerSize.h/2; const scale=clamp(view.scale*f,0.4,14); view={scale,tx:cx-((cx-view.tx)/view.scale)*scale, ty:cy-((cy-view.ty)/view.scale)*scale}; renderCanvas(); updateHeader();}

// ---------- Pointer handling ----------
let drag=null; const pointers=new Map();
svg.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-type]'); userMoved=true;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  if(pointers.size===2){const pts=[...pointers.values()]; const mid=toInches((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2); drag={type:'pinch',startDist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),startScale:view.scale,midInchX:mid.x,midInchY:mid.y}; return}
  if(!t){ selectedItemId=null; selectedOpeningId=null; drag={type:'pan',startX:e.clientX,startY:e.clientY,origTx:view.tx,origTy:view.ty}; renderCanvas(); if(currentTab==='edit') renderPanel(); return}
  const type=t.dataset.type;
  if(type==='item'){const item=design.items.find(i=>i.id===t.dataset.id); if(!item)return; selectedItemId=item.id; selectedOpeningId=null; currentTab='edit'; const inch=toInches(e.clientX,e.clientY); drag={type:'item',id:item.id,grabDX:inch.x-item.xIn,grabDY:inch.y-item.yIn}; renderTabs(); renderCanvas(); renderPanel(); e.stopPropagation(); return}
  if(type==='opening'){const op=design.openings.find(o=>o.id===t.dataset.id); if(!op)return; selectedOpeningId=op.id; selectedItemId=null; currentTab='edit'; const inch=toInches(e.clientX,e.clientY); const along=(op.wall==='north'||op.wall==='south')?inch.x:inch.y; drag={type:'opening',id:op.id,grabOff:along-op.offsetIn}; renderTabs(); renderCanvas(); renderPanel(); e.stopPropagation(); return}
  if(type==='handle'){drag={type:'resize',id:t.dataset.id,handle:t.dataset.handle}; e.stopPropagation(); return}
  if(type==='wall'){drag={type:'wall',wall:t.dataset.wall}; e.stopPropagation(); return}
});
svg.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag) return; const inch=toInches(e.clientX,e.clientY); const W=design.room.widthIn,D=design.room.depthIn;
  if(drag.type==='pinch'){const pts=[...pointers.values()]; if(pts.length<2)return; const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y); const r=svg.getBoundingClientRect(); const midPx=(pts[0].x+pts[1].x)/2-r.left, midPy=(pts[0].y+pts[1].y)/2-r.top; const scale=clamp(drag.startScale*(dist/Math.max(20,drag.startDist)),0.4,14); view={scale,tx:midPx-drag.midInchX*scale,ty:midPy-drag.midInchY*scale}; renderCanvas(); return}
  if(drag.type==='pan'){view={...view,tx:drag.origTx+(e.clientX-drag.startX),ty:drag.origTy+(e.clientY-drag.startY)}; renderCanvas(); return}
  if(drag.type==='item'){const item=design.items.find(i=>i.id===drag.id); if(!item)return; const r=itemRect(item); item.xIn=clamp(snap(inch.x-drag.grabDX),0,Math.max(0,W-r.w)); item.yIn=clamp(snap(inch.y-drag.grabDY),0,Math.max(0,D-r.d)); renderCanvas(); updateHeader(); syncEditInputs(); return}
  if(drag.type==='opening'){const op=design.openings.find(o=>o.id===drag.id); if(!op)return; const along=(op.wall==='north'||op.wall==='south')?inch.x:inch.y; const wallLen=(op.wall==='north'||op.wall==='south')?W:D; op.offsetIn=clamp(snap(along-drag.grabOff),0,Math.max(0,wallLen-op.widthIn)); renderCanvas(); syncEditInputs(); return}
  if(drag.type==='resize'){const item=design.items.find(i=>i.id===drag.id); if(!item)return; const r=itemRect(item); let ew=r.w,ed=r.d; if(drag.handle==='e'||drag.handle==='se') ew=clamp(snap(inch.x-r.x),6,600); if(drag.handle==='s'||drag.handle==='se') ed=clamp(snap(inch.y-r.y),6,600); const swapped=item.rotation%180!==0; item.wIn=swapped?ed:ew; item.dIn=swapped?ew:ed; renderCanvas(); updateHeader(); syncEditInputs(); return}
  if(drag.type==='wall'){if(drag.wall==='east') design.room.widthIn=clamp(snap(inch.x),48,720); else design.room.depthIn=clamp(snap(inch.y),48,720); renderCanvas(); updateHeader(); syncEditInputs(); return}
});
function endDrag(e){pointers.delete(e.pointerId); if(pointers.size===0) drag=null; else if(drag&&drag.type==='pinch') drag=null}
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('wheel',e=>{e.preventDefault(); userMoved=true; const r=svg.getBoundingClientRect(); const px=e.clientX-r.left, py=e.clientY-r.top; const factor=e.deltaY<0?1.12:0.89; const scale=clamp(view.scale*factor,0.4,14); view={scale,tx:px-((px-view.tx)/view.scale)*scale, ty:py-((py-view.ty)/view.scale)*scale}; renderCanvas(); updateHeader();},{passive:false});
document.getElementById('zoomIn').onclick=()=>zoomBy(1.25);
document.getElementById('zoomOut').onclick=()=>zoomBy(0.8);
document.getElementById('zoomFit').onclick=()=>fit();
new ResizeObserver(()=>{const r=wrap.getBoundingClientRect(); const old=containerSize; containerSize={w:r.width,h:r.height}; if(!fitted&&r.width>10){fitted=true; fit()} else if(!userMoved && (Math.abs(old.w-r.width)>2||Math.abs(old.h-r.height)>2)){fit()} else renderCanvas()}).observe(wrap);

function syncEditInputs(){
  // update numeric inputs in Edit/Room panels without stealing focus
  const active=document.activeElement;
  document.querySelectorAll('[data-bind]').forEach(inp=>{
    if(inp===active) return;
    const path=inp.dataset.bind; let val=null;
    if(path==='item.x') {const it=design.items.find(i=>i.id===selectedItemId); if(it) val=Math.round(it.xIn*10)/10}
    if(path==='item.y') {const it=design.items.find(i=>i.id===selectedItemId); if(it) val=Math.round(it.yIn*10)/10}
    if(path==='item.w') {const it=design.items.find(i=>i.id===selectedItemId); if(it) val=Math.round(it.wIn*10)/10}
    if(path==='item.d') {const it=design.items.find(i=>i.id===selectedItemId); if(it) val=Math.round(it.dIn*10)/10}
    if(path==='room.w') val=design.room.widthIn; if(path==='room.d') val=design.room.depthIn;
    if(path==='opening.offset'){const op=design.openings.find(o=>o.id===selectedOpeningId); if(op) val=op.offsetIn}
    if(val!=null) inp.value=val;
  });
}

// ---------- Helpers for panels ----------
function numField(label,bind,value,min,max,onchange){
  return `<label class="field"><span>${label}</span><input data-bind="${bind}" data-min="${min}" data-max="${max}" type="number" inputmode="decimal" value="${Math.round(value*10)/10}" onchange="window.__numChange(this, '${bind}')"></label>`;
}
window.__numChange=function(el,bind){
  const v=clamp(parseFloat(el.value)||0, parseFloat(el.dataset.min||0), parseFloat(el.dataset.max||9999));
  if(bind==='item.x'){const it=design.items.find(i=>i.id===selectedItemId); if(it) it.xIn=v}
  if(bind==='item.y'){const it=design.items.find(i=>i.id===selectedItemId); if(it) it.yIn=v}
  if(bind==='item.w'){const it=design.items.find(i=>i.id===selectedItemId); if(it) it.wIn=v}
  if(bind==='item.d'){const it=design.items.find(i=>i.id===selectedItemId); if(it) it.dIn=v}
  if(bind==='item.h'){const it=design.items.find(i=>i.id===selectedItemId); if(it) it.hIn=v}
  if(bind==='room.w'){design.room.widthIn=v; fit()}
  if(bind==='room.d'){design.room.depthIn=v; fit()}
  if(bind==='room.h'){design.room.wallHeightIn=v}
  if(bind==='opening.offset'){const op=design.openings.find(o=>o.id===selectedOpeningId); if(op) op.offsetIn=v}
  if(bind==='opening.width'){const op=design.openings.find(o=>o.id===selectedOpeningId); if(op){op.widthIn=v; const len=(op.wall==='north'||op.wall==='south')?design.room.widthIn:design.room.depthIn; op.offsetIn=clamp(op.offsetIn,0,Math.max(0,len-v))}}
  renderCanvas(); updateHeader();
};
function finishPicker(current){
  return `<fieldset style="border:none;padding:0;margin:0"><legend class="label">Finish</legend><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${FINISHES.map(f=>`<button class="finish-dot ${current===f.hex?'sel':''}" style="background:${f.hex}" title="${f.name}" aria-label="Finish ${f.name}" data-finish="${f.hex}"></button>`).join('')}<input type="color" value="${current}" data-colorpick style="width:40px;height:32px;border:1px solid var(--border);border-radius:6px;background:transparent"></div></fieldset>`;
}
function selectItem(id){selectedItemId=id; if(id){selectedOpeningId=null; currentTab='edit'} renderTabs(); renderCanvas(); renderPanel();}
function selectOpening(id){selectedOpeningId=id; if(id){selectedItemId=null; currentTab='edit'} renderTabs(); renderCanvas(); renderPanel();}

// ---------- Panels ----------
function renderPanel(){
  if(currentTab==='add') renderAdd();
  else if(currentTab==='edit') renderEdit();
  else if(currentTab==='room') renderRoom();
  else if(currentTab==='checks') renderChecks();
  else if(currentTab==='share') renderShare();
  else if(currentTab==='account') renderAccount();
}
function renderAdd(){
  const q=searchQuery.trim().toLowerCase();
  const matches=e=>!q||e.name.toLowerCase().includes(q)||e.blurb.toLowerCase().includes(q)||e.category.toLowerCase().includes(q);
  let h=`<input class="search-input" id="searchBox" type="search" placeholder="Search cabinets, appliances…" value="${esc(searchQuery)}" aria-label="Search">`;
  for(const cat of CATEGORIES){const entries=CATALOG.filter(e=>e.category===cat&&matches(e)); if(!entries.length) continue;
    h+=`<section style="margin-top:20px"><h2 class="font-display" style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0">${cat}</h2>`;
    for(const e of entries) h+=`<div class="cat-item"><span class="swatch" style="background:${e.color}"></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.name}</span><span class="mono" style="font-size:12px;color:var(--dim)">${e.wIn}×${e.dIn}×${e.hIn}″ · ${e.blurb}</span></span><button class="btn btn-primary" style="padding:7px 14px" data-add="${e.id}">Add</button></div>`;
    h+=`</section>`;
  }

  // custom product

  const doDownload=()=>{const payload=serializeDesign(); const name=payload.name; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const aEl=document.createElement('a'); aEl.href=url; aEl.download=name.replace(/[^a-z0-9-_]+/gi,'-').slice(0,60)+'.json'; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); const m=document.getElementById('shareMsg'); if(m) m.textContent='Downloaded — check your Files / Downloads.'};
  document.getElementById('dlBtn').onclick=doDownload;
  document.getElementById('copySummaryBtn').onclick=async()=>{const a2=getAnalysis(); const lines=[document.getElementById('designName').value, `Room: ${fmtIn(design.room.widthIn)} × ${fmtIn(design.room.depthIn)} (${Math.round(a2.areaSqFt)} sq ft)`, `Budget (priced pieces): ${fmtMoney(a2.budgetCents)}`, '', 'Pieces:']; design.items.forEach(i=>lines.push(`- ${i.name} — ${Math.round(itemRect(i).w)}×${Math.round(itemRect(i).d)}″ at ${Math.round(i.xIn)}″, ${Math.round(i.yIn)}″${i.priceCents!=null?' — '+fmtMoney(i.priceCents):''}${i.productUrl?' — '+i.productUrl:''}`)); if(a2.triangle) lines.push('',`Work triangle: ${a2.triangle.totalFt.toFixed(1)} ft total — ${a2.triangle.verdict}`); const txt=lines.join('\n'); try{await navigator.clipboard.writeText(txt); document.getElementById('shareMsg').textContent='Summary copied — paste it into a text or email.'}catch(e){document.getElementById('shareMsg').textContent='Copy blocked by the browser — use Download instead.'}};
  document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('blankBtn').onclick=()=>{if(confirmClear){design.items=[]; confirmClear=false; selectedItemId=null; renderCanvas(); updateHeader(); renderPanel()} else {confirmClear=true; renderPanel()}};
  // expose for header button
  window.__doDownload=doDownload;
}
// import
// ---------- Design import (one path for file import + cloud load) ----------
function applyImportedDesign(parsed){
  const data=parsed.data||parsed;
  if(!data.room||!Array.isArray(data.items)||!Array.isArray(data.openings)) throw new Error('bad');
  design=data; if(parsed.name) document.getElementById('designName').value=parsed.name; selectedItemId=null; selectedOpeningId=null; fitted=false; fit(); renderCanvas(); updateHeader(); currentTab='checks'; renderTabs(); renderPanel();
}
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const reader=new FileReader(); reader.onload=()=>{try{applyImportedDesign(JSON.parse(reader.result))}catch(err){ currentTab='share'; renderTabs(); renderPanel(); const m=document.getElementById('shareMsg'); if(m){m.style.color='var(--rust)'; m.textContent='That file could not be opened as a kitchen design.'}}}; reader.readAsText(f); e.target.value='';
});
document.getElementById('topDownload').onclick=()=>{ if(window.__doDownload) window.__doDownload(); else {currentTab='share'; renderTabs(); renderPanel(); if(window.__doDownload) window.__doDownload()} };
document.getElementById('stripShareBtn').onclick=()=>{currentTab='share'; renderTabs(); renderPanel(); panel.scrollTop=0};
document.getElementById('designName').addEventListener('input',()=>{});

// init
renderTabs(); renderPanel(); updateHeader();
// fit after layout settles
setTimeout(()=>{const r=wrap.getBoundingClientRect(); containerSize={w:r.width,h:r.height}; fitted=true; fit()},50);
</script>
<script>

// ---------- Cloud save (Supabase) — shared household library ----------
const SUPABASE_URL='https://phmkvubxlldxzdpjytqf.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBobWt2dWJ4bGxkeHpkcGp5dHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNTMxNTMsImV4cCI6MjA5MjcyOTE1M30.gSunjBB4l9nEasU-ek0EssKthFJDdBgO9GUBZMNxnPc';
let sb=null;
try{ if(window.supabase&&window.supabase.createClient) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ sb=null; }

let cloudUser=null, currentCloudId=null, currentCloudName=null, cloudRows=[];
let lastSavedSig=null, lastChangeSig='', lastChangeAt=0, savingNow=false, saveError=false, lastSaveErrAt=0;
let confirmCloudDelete=null, knownDesignRef=design, cloudLoading=false;

function designSig(){ try{ return JSON.stringify({n:(document.getElementById('designName').value||'').trim(), d:design}); }catch(e){ return ''; } }
function saveStatusText(){
  if(!sb) return 'Cloud unavailable';
  if(!cloudUser) return 'Sign in to save';
  if(savingNow) return 'Saving…';
  if(saveError) return 'Save failed — will retry';
  if(lastSavedSig&&lastSavedSig===designSig()) return 'Saved ✓';
  if(!currentCloudId) return 'Not saved yet';
  return 'Unsaved changes';
}
function setSaveStatus(){
  const el=document.getElementById('saveStatus'); if(el) el.textContent=saveStatusText();
  const line=document.getElementById('cloudSaveLine'); if(line) line.textContent=saveStatusText()+(currentCloudName?' · Editing “'+currentCloudName+'”':'');
}
function cloudMsg(t){ const m=document.getElementById('cloudMsg'); if(m) m.textContent=t||''; }

async function cloudSaveNow(){
  if(!sb||!cloudUser||savingNow) return false;
  savingNow=true; setSaveStatus();
  const payload=serializeDesign();
  const savedSig=JSON.stringify({n:payload.name, d:payload.data});
  let ok=false;
  try{
    if(currentCloudId){
      const r=await sb.from('kitchen_designs').update({name:payload.name, data:payload, updated_at:new Date().toISOString()}).eq('id',currentCloudId).select('id');
      if(r.error) throw r.error;
      if(!r.data||!r.data.length){ currentCloudId=null; throw new Error('That saved design no longer exists — saving a fresh copy.'); }
    }
    if(!currentCloudId){
      const r=await sb.from('kitchen_designs').insert({name:payload.name, data:payload, created_by:cloudUser.id}).select('id,name').single();
      if(r.error) throw r.error;
      currentCloudId=r.data.id;
    }
    currentCloudName=payload.name; lastSavedSig=savedSig; saveError=false; lastSaveErrAt=0; ok=true;
    refreshCloudList();
  }catch(e){
    saveError=true; lastSaveErrAt=Date.now();
    if(currentTab==='account') cloudMsg('Save hit a snag ('+(e&&e.message?e.message:'network')+'). Working locally — it will keep retrying.');
  }
  savingNow=false; setSaveStatus();
  return ok;
}

function cloudLoad(row){
  cloudLoading=true;
  try{ applyImportedDesign(row.data); }
  catch(e){ cloudLoading=false; if(currentTab==='account') cloudMsg('That saved design could not be opened.'); return; }
  currentCloudId=row.id; currentCloudName=row.name||null; knownDesignRef=design;
  lastSavedSig=designSig(); lastChangeSig=lastSavedSig; saveError=false;
  cloudLoading=false; setSaveStatus();
}

async function cloudDuplicate(row){
  if(!sb||!cloudUser) return;
  const r=await sb.from('kitchen_designs').insert({name:((row.name||'Design')+' copy'), data:row.data, created_by:cloudUser.id}).select('id').single();
  if(r.error){ cloudMsg('Duplicate failed: '+r.error.message); return; }
  cloudMsg('Duplicated as “'+(row.name||'Design')+' copy”.');
  refreshCloudList();
}

async function cloudDelete(row){
  if(confirmCloudDelete!==row.id){ confirmCloudDelete=row.id; renderCloudList(); return; }
  confirmCloudDelete=null;
  const r=await sb.from('kitchen_designs').delete().eq('id',row.id);
  if(r.error){ cloudMsg('Delete failed: '+r.error.message); renderCloudList(); return; }
  if(row.id===currentCloudId){ currentCloudId=null; currentCloudName=null; lastSavedSig=designSig(); lastChangeSig=lastSavedSig; setSaveStatus(); }
  cloudMsg('Deleted “'+(row.name||'Design')+'”.');
  refreshCloudList();
}

async function cloudNew(){
  const nameInput=document.getElementById('cloud-name');
  const name=((nameInput&&nameInput.value)||'').trim()||'Untitled design';
  design=emptyDesign();
  document.getElementById('designName').value=name;
  selectedItemId=null; selectedOpeningId=null;
  currentCloudId=null; currentCloudName=null; lastSavedSig=null; saveError=false;
  knownDesignRef=design; lastChangeSig=''; lastChangeAt=Date.now();
  fitted=false; fit(); renderCanvas(); updateHeader();
  await cloudSaveNow();
  if(currentTab==='account') renderPanel();
}

async function refreshCloudList(){
  if(!sb||!cloudUser) return;
  const r=await sb.from('kitchen_designs').select('id,name,data,created_by,updated_at').order('updated_at',{ascending:false});
  const listEl=document.getElementById('cloudList');
  if(r.error){ if(listEl) listEl.innerHTML='<p style="color:var(--rust);font-size:14px">Could not load the library: '+esc(r.error.message)+'</p>'; return; }
  cloudRows=r.data||[];
  renderCloudList();
}

function renderCloudList(){
  const listEl=document.getElementById('cloudList'); if(!listEl) return;
  if(!cloudRows.length){ listEl.innerHTML='<p style="color:var(--dim);font-size:14px">No saved designs yet — once a design saves, it shows up here for both of you.</p>'; return; }
  listEl.innerHTML=cloudRows.map(r=>'<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)">'
    +'<span style="flex:1;min-width:0"><span style="display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name||'Untitled design')+(r.id===currentCloudId?' <span style="color:var(--good);font-size:12px">● open</span>':'')+'</span>'
    +'<span class="mono" style="font-size:12px;color:var(--dim)">'+esc(new Date(r.updated_at).toLocaleString())+'</span></span>'
    +'<button class="btn" style="padding:7px 10px;font-size:13px" data-cloud-load="'+r.id+'">Load</button>'
    +'<button class="btn" style="padding:7px 10px;font-size:13px" data-cloud-dup="'+r.id+'">Duplicate</button>'
    +'<button class="btn '+(confirmCloudDelete===r.id?'btn-rust':'')+'" style="padding:7px 10px;font-size:13px" data-cloud-del="'+r.id+'">'+(confirmCloudDelete===r.id?'Tap again to delete':'Delete')+'</button>'
    +'</div>').join('');
  listEl.querySelectorAll('[data-cloud-load]').forEach(b=>b.onclick=()=>{ const r=cloudRows.find(x=>x.id===b.dataset.cloudLoad); if(r) cloudLoad(r); });
  listEl.querySelectorAll('[data-cloud-dup]').forEach(b=>b.onclick=()=>{ const r=cloudRows.find(x=>x.id===b.dataset.cloudDup); if(r) cloudDuplicate(r); });
  listEl.querySelectorAll('[data-cloud-del]').forEach(b=>b.onclick=()=>{ const r=cloudRows.find(x=>x.id===b.dataset.cloudDel); if(r) cloudDelete(r); });
}

// ---------- Account panel ----------
function renderAccount(){
  let h='<div style="display:flex;flex-direction:column;gap:18px">';
  h+='<div><h2 class="font-display" style="font-size:18px;margin:0">Account & cloud designs</h2><p style="color:var(--dim);line-height:1.55;margin:8px 0 0">Sign in to save designs to the shared library — Smitty and Christine both see every saved design, and changes save themselves. The planner works without signing in; it just won\'t save.</p></div>';
  if(!sb){
    h+='<p style="color:var(--rust);line-height:1.5">Cloud is unreachable right now — the planner still works locally. Use “Download design file” in Keep &amp; Share to keep a copy.</p>';
  } else if(!cloudUser){
    h+='<div style="display:flex;flex-direction:column;gap:12px">'
      +'<label class="field"><span>Email</span><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com"></label>'
      +'<label class="field"><span>Password</span><input id="auth-pass" type="password" autocomplete="current-password" placeholder="Password"></label>'
      +'<div style="display:flex;gap:8px"><button class="btn btn-primary" id="auth-signin" style="flex:1">Sign in</button><button class="btn" id="auth-signup" style="flex:1">Create account</button></div>'
      +'<p id="auth-msg" style="font-size:13px;color:var(--dim);margin:0;min-height:18px"></p></div>';
  } else {
    h+='<div style="background:var(--surface-alt);border-radius:10px;padding:14px">'
      +'<p style="margin:0;font-size:14px">Signed in as <b>'+esc(cloudUser.email||'')+'</b></p>'
      +'<p id="cloudSaveLine" style="font-size:13px;color:var(--dim);margin:6px 0 0"></p>'
      +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-primary" id="cloud-save-now">Save now</button><button class="btn" id="cloud-new">New design</button><button class="btn" id="auth-signout">Sign out</button></div>'
      +'<div style="display:flex;gap:8px;margin-top:12px"><input id="cloud-name" placeholder="Design name" value="'+esc(currentCloudName||document.getElementById('designName').value||'')+'" style="flex:1;min-width:0;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:9px 10px;font-size:16px"><button class="btn" id="cloud-rename">Rename</button></div>'
      +'<p id="cloudMsg" style="font-size:13px;color:var(--dim);margin:10px 0 0;min-height:18px"></p></div>'
      +'<div><div style="display:flex;align-items:center;justify-content:space-between"><h3 class="font-display" style="margin:0;font-size:15px">Cloud designs</h3><button class="btn" id="cloud-refresh" style="padding:6px 10px;font-size:13px">Refresh</button></div>'
      +'<div id="cloudList"><p style="color:var(--dim);font-size:14px">Loading…</p></div></div>';
  }
  h+='</div>';
  panel.innerHTML=h;
  if(sb&&!cloudUser){
    const doAuth=async(mode)=>{
      const email=(document.getElementById('auth-email').value||'').trim();
      const pass=document.getElementById('auth-pass').value||'';
      const msg=document.getElementById('auth-msg');
      if(!email||!pass){ msg.textContent='Enter an email and a password.'; return; }
      msg.textContent=mode==='in'?'Signing in…':'Creating account…';
      const res=mode==='in' ? await sb.auth.signInWithPassword({email:email,password:pass}) : await sb.auth.signUp({email:email,password:pass});
      if(res.error){ msg.textContent=res.error.message; return; }
      if(mode==='up'&&!(res.data&&res.data.session)){ msg.textContent='Account created — if email confirmation is switched on, confirm from your inbox, then sign in.'; }
    };
    document.getElementById('auth-signin').onclick=()=>doAuth('in');
    document.getElementById('auth-signup').onclick=()=>doAuth('up');
  }
  if(sb&&cloudUser){
    setSaveStatus();
    document.getElementById('auth-signout').onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} };
    document.getElementById('cloud-save-now').onclick=async()=>{ const ok=await cloudSaveNow(); cloudMsg(ok?'Saved just now.':'Could not save — check your connection.'); };
    document.getElementById('cloud-new').onclick=()=>cloudNew();
    document.getElementById('cloud-refresh').onclick=()=>refreshCloudList();
    document.getElementById('cloud-rename').onclick=async()=>{
      const v=(document.getElementById('cloud-name').value||'').trim();
      if(!v){ cloudMsg('Type a name first.'); return; }
      document.getElementById('designName').value=v;
      if(currentCloudId){
        const r=await sb.from('kitchen_designs').update({name:v, updated_at:new Date().toISOString()}).eq('id',currentCloudId);
        if(r.error){ cloudMsg('Rename failed: '+r.error.message); return; }
        currentCloudName=v; lastSavedSig=designSig(); setSaveStatus(); refreshCloudList();
      }
      cloudMsg('Renamed to “'+v+'”.');
    };
    refreshCloudList();
  }
}

// ---------- Auth wiring + autosave ----------
if(sb){
  sb.auth.onAuthStateChange((evt,session)=>{
    cloudUser=session?session.user:null;
    if(cloudUser){ lastChangeSig=designSig(); lastChangeAt=Date.now(); }
    else { currentCloudId=null; currentCloudName=null; cloudRows=[]; }
    setSaveStatus();
    if(currentTab==='account') renderPanel();
  });
  sb.auth.getSession().then(({data})=>{
    cloudUser=data&&data.session?data.session.user:null;
    setSaveStatus();
    if(currentTab==='account') renderPanel();
  }).catch(()=>{});
}
setSaveStatus();
setInterval(()=>{
  // A replaced design object (file import / new design) that didn't come from the
  // cloud is a different design — detach it so autosave files it as a new row.
  if(design!==knownDesignRef){ knownDesignRef=design; if(!cloudLoading){ currentCloudId=null; currentCloudName=null; } }
  const sig=designSig();
  if(sig!==lastChangeSig){ lastChangeSig=sig; lastChangeAt=Date.now(); }
  if(cloudUser&&!savingNow&&sig!==lastSavedSig&&(Date.now()-lastChangeAt)>=1500&&(Date.now()-lastSaveErrAt)>=4000){ cloudSaveNow(); }
  setSaveStatus();
},600);
</script>
